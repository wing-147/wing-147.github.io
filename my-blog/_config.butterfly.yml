# Butterfly theme overrides
# Full reference: themes/butterfly/_config.yml

# Home page subtitle
subtitle:
    enable: true
    sub:
        - 人生就像段错误，你必须找到它错在哪
        - 一天一 house of apple, segment fault 远离我
        - 人生没有绝对安全的代码，只有不断进化的防御与攻击
        - 当你凝视漏洞时，漏洞也在凝视你
        - 调试代码和调试人生一样，关键不是避开错误，而是学会修复
        - 所有系统都有漏洞，区别在于，你是否选择 exploit
        - 事实上这些话全是AI写的

menu:
    主页: / || fas fa-home
    博文 || fa fa-graduation-cap:
        分类: /categories/ || fa fa-archive
        标签: /tags/ || fa fa-tags
        归档: /archives/ || fa fa-folder-open
    友链: /links/ || fa fa-link

# Code blocks
code_blocks:
    theme: darker
    macStyle: true
    word_wrap: true

# Local search
search:
    use: local_search
    placeholder: 搜索文章
    local_search:
        preload: true

index_img: /images/wallpaper/loading.jpg
favicon: /images/wallpaper/favicon.jpg
avatar:
    img: /images/wallpaper/avatar.jpg
archive_img: /images/wallpaper/archive.png
tag_img: /images/wallpaper/tag.jpg
category_img: /images/wallpaper/category.png
default_top_img: /images/wallpaper/loading.jpg
footer_img: /images/wallpaper/footer.jpg

# Post copyright
post_copyright:
    author_href: https://github.com/wing-147

# Footer
footer:
    owner:
        since: 2025

# Aside
aside:
    card_author:
        description: 一个 PWN 手的学习记录
        button:
            text: GitHub
            link: https://github.com/wing-147
    card_announcement:
        enable: false

lightbox: medium_zoom

# Custom styles
inject:
    head:
        - <link rel="stylesheet" href="/css/custom.css">

# Replace Butterfly's unreliable default Busuanzi endpoint.
CDN:
    option:
        busuanzi: https://busuanzi.icodeq.com/busuanzi.pure.mini.js
